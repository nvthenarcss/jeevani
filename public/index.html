<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jeevani</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#3E5A4B"><link rel="icon" href="/icon-192.png">
<style>

.tab{background:transparent;color:#fff;border:1px solid #ffffff50;border-radius:999px;padding:8px 15px;font-size:13px;cursor:pointer;transition:all .2s}.tab:hover,.tab.on{background:var(--sand);border-color:var(--sand);color:#19352f}

label.f{display:block;font-weight:600;margin:10px 0 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 14px;border-radius:24px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.banner{border-radius:18px;padding:22px;color:#fff;margin-bottom:15px;box-shadow:var(--shadow)}.banner h2{margin:0 0 6px;font-size:29px;color:inherit}

.pill{display:inline-block;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:700}

table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:9;max-width:90%}
.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:bold;color:var(--mute)}.hero{padding:26px 24px 22px;border-radius:24px;background:linear-gradient(120deg,#153d38,#286b5a 70%,#638b6b);color:white;margin:8px 0 16px;position:relative;overflow:hidden;box-shadow:0 18px 34px #153d382b}.hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid #ffffff2a;border-radius:50%;right:-75px;top:-115px;box-shadow:0 0 0 24px #ffffff0d,0 0 0 48px #ffffff0a}.hero h1{color:white;max-width:620px}.hero p{max-width:590px;color:#e3eee7;margin:8px 0 0}.statgrid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px;margin:12px 0 18px}.stat{background:#fffdf7d9;border:1px solid var(--line);border-radius:16px;padding:14px 16px}.stat strong{font:700 25px Georgia,serif;display:block;color:var(--deep)}.stat span{font-size:12px;color:var(--mute)}.resourcegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.resource img{width:100%;height:150px;object-fit:cover;border-radius:12px;background:var(--sage)}.resource h3{font:700 17px "Trebuchet MS",sans-serif;letter-spacing:0;margin:10px 0 2px}.dropnote{padding:14px;border:1px dashed #91a89a;border-radius:14px;background:#eff4ed;color:var(--mute);font-size:13px}.statusrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.onlinedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#70bc82;margin-right:5px}@media(max-width:720px){.statgrid{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:12px}header b{width:100%;margin-bottom:3px}.wrap{padding:18px 13px}.scroll table{min-width:780px}}
/* Refined visual system: calm contrast, quiet surfaces and restrained accents. */
:root{--bg:#151d1a;--card:#202b27;--ink:#f1eee5;--mute:#aab4ad;--deep:#182521;--btn:#416c5d;--ac:#b3c8bb;--sage:#2c3b34;--sand:#c9a66b;--line:#37453f;--shadow:0 10px 28px #00000022}
body{background:#151d1a;color:var(--ink);font-family:"Aptos", "Segoe UI", sans-serif}
header{background:#192824;box-shadow:none;border-bottom:1px solid #ffffff12}
.tab:hover,.tab.on{background:#c9a66b;border-color:#c9a66b;color:#1c2925}
.wrap{padding-top:22px}
.card{background:#202b27;border-color:#35433d;border-radius:14px;box-shadow:0 6px 18px #00000018}

button.big{border-radius:10px;background:#416c5d;box-shadow:none}
button.big:hover{transform:translateY(-1px);filter:brightness(1.04)}
button.alt{background:#2c3b34;color:#edf0e8}

.chip{border-width:1px;border-radius:8px}
.chip.on{background:#416c5d;border-color:#416c5d}

.hero h1{font-size:clamp(29px,4.5vw,40px);max-width:540px;color:#fbfaf5;line-height:1.1}
.hero p{color:#d6dfd9;max-width:530px;font-size:15px}
.eyebrow{letter-spacing:.1em;font-size:10px}

<script src="/engine.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const T={en:{unlock:'Unlock',setpin:'Set a 4–6 digit PIN',pin:'Enter PIN',newcase:'New case',recent:'Recent cases',empty:'No cases yet',emptyhint:'Your saved cases stay on this device until you sync.',begin:'Begin here',saved:'Saved on this device',wait:'waiting to sync',syncnow:'Sync now',s0:'Pregnancy & vitals',s1:'Danger signs',ga:'Gestational age (weeks)',sys:'BP systolic',dia:'BP diastolic',hb:'Haemoglobin (g/dL)',bleed:'Bleeding',none:'None',spotting:'Spotting',heavy:'Heavy',fm:'Fetal movement',normal:'Normal',reduced:'Reduced',absent:'Absent',head:'Severe headache',vis:'Blurred vision',swell:'Swelling face/hands',conv:'Convulsions',fever:'Fever',next:'Next',back:'Back',check:'Check risk',confirm:'Confirm details',emergency:'EMERGENCY',urgent:'URGENT REVIEW',routine:'ROUTINE FOLLOW-UP',a_emergency:'Prompt immediate action under local referral protocol',a_urgent:'Contact supervisor or referral facility for prompt review',a_routine:'Continue scheduled care and reassess',why:'Triggered by',miss:'Incomplete, not treated as normal',note:'Decision support for trained workers. Does not diagnose. Thresholds pending clinical review.',act:'Action taken',save:'Save (encrypted)',voice:'Speak details'},
hi:{unlock:'खोलें',setpin:'4–6 अंकों का PIN बनाएँ',pin:'PIN डालें',newcase:'नया केस',recent:'हाल के केस',empty:'अभी कोई केस नहीं',emptyhint:'सिंक करने तक आपके केस इसी डिवाइस पर सुरक्षित रहेंगे।',begin:'यहाँ से शुरू करें',saved:'इस फ़ोन में सुरक्षित',wait:'सिंक के इंतज़ार में',syncnow:'अभी सिंक करें',s0:'गर्भावस्था और माप',s1:'ख़तरे के संकेत',ga:'गर्भ के सप्ताह',sys:'BP ऊपरी',dia:'BP निचला',hb:'हीमोग्लोबिन (g/dL)',bleed:'रक्तस्राव',none:'नहीं',spotting:'हल्का',heavy:'ज़्यादा',fm:'शिशु की हलचल',normal:'सामान्य',reduced:'कम',absent:'नहीं है',head:'तेज़ सिरदर्द',vis:'धुंधला दिखना',swell:'चेहरे/हाथ में सूजन',conv:'दौरे',fever:'बुखार',next:'आगे',back:'पीछे',check:'जोखिम देखें',confirm:'जानकारी जाँचें',emergency:'आपातकाल',urgent:'तुरंत समीक्षा',routine:'नियमित देखभाल',a_emergency:'स्थानीय प्रोटोकॉल के अनुसार तुरंत कार्रवाई करें',a_urgent:'सुपरवाइज़र/रेफ़रल केंद्र से तुरंत संपर्क करें',a_routine:'तय देखभाल जारी रखें और फिर जाँचें',why:'कारण',miss:'अधूरी जानकारी, सामान्य नहीं माना गया',note:'प्रशिक्षित कर्मियों के लिए सहायक टूल। निदान नहीं करता। सीमाएँ चिकित्सकीय समीक्षा के अधीन।',act:'की गई कार्रवाई',save:'सुरक्षित सहेजें',voice:'बोलकर भरें'}};
let S={mode:'worker',lang:'en',off:false,view:'lock',key:null,cases:[],draft:{},step:0,cur:null,sup:false,tok:null,wtok:LS.get('sb_wtok',null),srv:[],resources:[],pane:'cases',filter:'all',err:'',uploading:false};
const t=k=>(T[S.lang][k]||T.en[k]||k);
const fmt=ts=>new Date(ts).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
/* ---- encryption (PIN -> PBKDF2 -> AES-GCM) ---- */
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(pin,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},S.key,enc.encode(JSON.stringify(o)));return{iv:b64(iv),ct:b64(ct)}}
async function open(o){return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},S.key,ub(o.ct))))}
const persist=async()=>LS.set('sb_data',await seal(S.cases));
async function unlock(pin){if(!/^\d{4,6}$/.test(pin)){S.err='PIN must be 4–6 digits';return render()}
 try{let salt=LS.get('sb_salt');const first=!salt;if(first){salt=b64(crypto.getRandomValues(new Uint8Array(16)));LS.set('sb_salt',salt)}
 S.key=await derive(pin,ub(salt));
 if(first){LS.set('sb_chk',await seal({ok:1}));await persist()}else{await open(LS.get('sb_chk'));const d=LS.get('sb_data');S.cases=d?await open(d):[]}
 S.view='home';S.err=''}catch(e){S.key=null;S.err='Wrong PIN'}render()}
/* ---- server API (Node backend) ---- */
async function api(p,o={},tk=S.tok){const r=await fetch(p,{...o,headers:{'Content-Type':'application/json',...(tk?{Authorization:'Bearer '+tk}:{})}});if(!r.ok)throw new Error(r.status);return r.json()}
async function wlogin(){const id=prompt('Worker ID'),pw=id&&prompt('Password');if(!id||!pw)return false;
 try{const r=await api('/api/worker/login',{method:'POST',body:JSON.stringify({id,password:pw})},null);S.wtok=r.token;LS.set('sb_wtok',r.token);return true}catch(e){toast('Worker sign-in failed');return false}}
async function doSync(){if(S.off)return toast('No network: cases stay queued on this phone');
 if(!S.wtok&&!(await wlogin()))return;
 try{const r=await api('/api/sync',{method:'POST',body:JSON.stringify({cases:S.cases})},S.wtok);let n=0;
  S.cases.forEach(c=>{if(!c.synced){c.synced=true;n++}if(r.statuses[c.id])c.st=r.statuses[c.id]});
  await persist();toast(n+' case(s) synced; statuses updated');render()}
 catch(e){if(String(e.message)=='401'){S.wtok=null;LS.set('sb_wtok',null);toast('Session expired. Tap Sync again to sign in')}else toast('Server unreachable: cases stay queued')}}
async function loadSrv(){try{S.srv=await api('/api/cases')}catch(e){toast('Cannot reach server')}render()}
async function login(){try{const r=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});S.tok=r.token;S.sup=true;S.err='';await loadSrv()}catch(e){S.err='Invalid credentials';render()}}
async function setSt(id,v){try{await api('/api/cases/'+id,{method:'PATCH',body:JSON.stringify({st:v})})}catch(e){toast('Update failed')}loadSrv()}
async function loadResources(){try{S.resources=await api('/api/resources')}catch(e){toast('Could not load resource library')}render()}
async function addResource(){if(S.uploading)return;const file=$('#resourceFile').files[0],title=$('#resourceTitle').value.trim();if(!file||!title)return toast('Add a title and choose an image');if(!/^image\/(png|jpeg|webp)$/.test(file.type)||file.size>5*1024*1024)return toast('Choose a PNG, JPG or WebP under 5 MB');S.uploading=true;render();try{const sig=await api('/api/cloudinary/sign',{method:'POST',body:'{}'});const fd=new FormData();Object.entries(sig).forEach(([k,v])=>fd.append(k,v));fd.append('file',file);const up=await fetch(`https://api.cloudinary.com/v1_1/${sig.cloud_name}/image/upload`,{method:'POST',body:fd});if(!up.ok)throw new Error('upload');const asset=await up.json();await api('/api/resources',{method:'POST',body:JSON.stringify({title,url:asset.secure_url})});S.resources=await api('/api/resources');S.uploading=false;toast('Education image added');render()}catch(e){S.uploading=false;toast(e.message==='503'?'Add Cloudinary keys in .env first':'Upload failed. Check Cloudinary setup and connection.');render()}}
/* ---- worker screens ---- */
function lock(){const first=!LS.get('sb_salt');return `<div class=card><h2>${first?t('setpin'):t('pin')}</h2><input id=pin type=password inputmode=numeric maxlength=6 autocomplete=off><button class=big onclick="unlock($('#pin').value)">${t('unlock')}</button><p class=mute>${S.err}</p><p class=mute>Cases are encrypted on this phone with a key derived from your PIN. Demo data is synthetic.</p></div>`}
function home(){const queued=S.cases.filter(c=>!c.synced).length,urgent=S.cases.filter(c=>c.cat==='emergency'||c.cat==='urgent').length;const L=S.cases.slice().sort((a,b)=>b.ts-a.ts).map((c,i)=>`<div class=card style="cursor:pointer;animation-delay:${Math.min(i,6)*45}ms" onclick="openCase('${esc(c.id)}')"><div class=statusrow><span class="pill ${esc(c.cat)}">${t(c.cat)}</span><span class=mute>${fmt(c.ts)} · ${c.synced?'✓ synced':'◷ queued'}</span></div><div style="margin-top:8px;font-weight:600">${c.why.slice(0,2).map(esc).join('; ')||'No configured warning sign recorded'}</div><div class=mute style="margin-top:5px">${esc(c.st)} · Open case →</div></div>`).join('');
 return `<div class=hero><span class=eyebrow style="color:#d5e3d8">Frontline worker · ${S.off?'offline capture':'ready to capture'}</span><h1>Good care starts with a clear picture.</h1><p>Record the findings, review every field, then follow your local referral protocol.</p></div><div class=statgrid style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class=stat><strong>${S.cases.length}</strong><span>Saved on this phone</span></div><div class=stat><strong>${queued}</strong><span>Waiting to sync · ${urgent} urgent flags</span></div></div><button class="big alt" onclick="newCase()">＋ ${t('newcase')}</button><button class="big ghost" onclick="doSync()">⟳ ${t('syncnow')}</button><h3>${t('recent')}</h3>${L||`<div class=card><p class=eyebrow>${t('begin')}</p><p>${t('empty')} ${t('emptyhint')}</p></div>`}`}
const newCase=()=>{S.draft={bleed:'none',fm:'normal'};S.step=0;S.view='cap';render()};
const openCase=id=>{S.cur=S.cases.find(c=>c.id==id);S.view='res';render()};
const limits={ga:[1,45,'1'],sys:[40,300,'1'],dia:[20,200,'1'],hb:[1,25,'0.1']};
const inp=(k,l)=>{const [min,max,step]=limits[k];return `<label class=f>${l}</label><input type=number inputmode=decimal min="${min}" max="${max}" step="${step}" value="${esc(S.draft[k]??'')}" oninput="S.draft['${k}']=this.value">`};
const seg=(k,o)=>`<div class=chips>${o.map(x=>`<button class="chip ${S.draft[k]==x?'on':''}" onclick="S.draft['${k}']='${x}';render()">${t(x)}</button>`).join('')}</div>`;
const chip=k=>`<button class="chip ${S.draft[k]?'on':''}" onclick="S.draft['${k}']=!S.draft['${k}'];render()">${t(k)}</button>`;
function rows(){const d=S.draft,y=k=>d[k]?'Yes':'No';return [[t('ga'),d.ga||'—'],['BP',d.sys&&d.dia?d.sys+'/'+d.dia:'—'],[t('hb'),d.hb||'—'],[t('bleed'),t(d.bleed)],[t('fm'),t(d.fm)],...['head','vis','swell','conv','fever'].map(k=>[t(k),y(k)])].map(r=>`<div class=row style="justify-content:space-between"><span class=mute>${esc(r[0])}</span><b style="text-align:right">${esc(r[1])}</b></div>`).join('')}
function cap(){const st=S.step;let b;
 if(st==0)b=`<button class="big ghost" onclick="voice()">🎙 ${t('voice')}</button>${inp('ga',t('ga'))}<div class=row><div>${inp('sys',t('sys'))}</div><div>${inp('dia',t('dia'))}</div></div>${inp('hb',t('hb'))}`;
 else if(st==1)b=`<label class=f>${t('bleed')}</label>${seg('bleed',['none','spotting','heavy'])}<label class=f>${t('fm')}</label>${seg('fm',['normal','reduced','absent'])}<label class=f>${t('s1')}</label><div class=chips>${['head','vis','swell','conv','fever'].map(k=>chip(k)).join('')}</div>`;
 else b=`<div style="margin-top:8px">${rows()}</div><p class=mute>Please check every field before scoring.</p>`;
 return `<div class=card><b>${st+1}/3 · ${[t('s0'),t('s1'),t('confirm')][st]}</b>${b}<div class=row>${st?`<button class="big ghost" onclick="S.step--;render()">${t('back')}</button>`:''}<button class=big onclick="${st==2?'check()':'S.step++;render()'}">${st==2?t('check'):t('next')}</button></div></div>`}
const check=()=>{for(const [k,[min,max]] of Object.entries(limits)){const v=S.draft[k];if(v!==''&&v!=null&&(!Number.isFinite(Number(v))||Number(v)<min||Number(v)>max)){toast(`${t(k)} must be between ${min} and ${max}`);return}}if((S.draft.sys&&!S.draft.dia)||(!S.draft.sys&&S.draft.dia)){toast('Enter both blood-pressure values, or leave both blank');return}S.cur={id:null,d:{...S.draft},...assess(S.draft)};S.view='res';render()};
function res(){const c=S.cur,saved=!!c.id;
 return `<div class="banner ${esc(c.cat)}"><h2>${t(c.cat)}</h2>${t('a_'+c.cat)}</div><div class=card><b>${t('why')}</b><ul>${(c.why.length?c.why:['No configured warning sign recorded']).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${c.miss.length?`<p><b>⚠ ${t('miss')}</b><br>${c.miss.map(esc).join(', ')}</p>`:''}</div>`+
 (saved?`<div class=card>${t('act')}: <b>${esc(c.act||'—')}</b><br>Status: <b>${esc(c.st)}</b> · ${c.synced?'✔ synced':'⏳ queued'}</div>`:`<div class=card><label class=f>${t('act')}</label><select id=act>${['Advised routine ANC','Referred to PHC','Referred to FRU/hospital','Called supervisor'].map(o=>`<option>${o}</option>`).join('')}</select><button class=big onclick="save()">🔒 ${t('save')}</button></div>`)+
 `<p class=mute>${t('note')}</p><button class="big ghost" onclick="S.view='home';render()">${t('back')}</button>`}
async function save(){const c={...S.cur,id:crypto.randomUUID().slice(0,8),w:'W1',ts:Date.now(),st:'New',act:$('#act').value,synced:false};S.cases.push(c);await persist();S.cur=c;S.view='home';toast('Saved offline (encrypted)');render()}
function voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return toast('Voice not supported in this browser. Use the form.');
 const r=new SR();r.lang=S.lang=='hi'?'hi-IN':'en-IN';
 r.onresult=e=>{const x=e.results[0][0].transcript.toLowerCase(),d=S.draft;let m;
  if(m=x.match(/(\d{2,3})\s*(?:over|by|\/|upon|बाई)\s*(\d{2,3})/)){d.sys=m[1];d.dia=m[2]}
  if(m=x.match(/(?:hb|haemoglobin|hemoglobin|हीमोग्लोबिन)\D*(\d+(?:\.\d)?)/))d.hb=m[1];
  if(m=x.match(/(\d{1,2})\s*(?:weeks|week|सप्ताह|हफ्ते)/))d.ga=m[1];
  if(/headache|सिर\s?दर्द|sar dard/.test(x))d.head=true;
  if(/bleeding|खून|रक्तस्राव/.test(x))d.bleed=/heavy|ज्यादा|ज़्यादा/.test(x)?'heavy':'spotting';
  if(/fever|बुखार/.test(x))d.fever=true;if(/swelling|सूजन/.test(x))d.swell=true;if(/vision|धुंधला/.test(x))d.vis=true;
  toast('Heard: "'+x+'". Please confirm.');render()};
 r.onerror=()=>toast('Could not hear. Try again.');r.start()}
/* ---- supervisor ---- */
function sup(){if(!S.sup)return `<div class=wrap><div class=hero><span class=eyebrow style="color:#d5e3d8">Jeevani · supervisor desk</span><h1>Care coordination, clearly.</h1><p>Review synced cases and keep practical guidance close at hand.</p></div><div class=card><h2>Supervisor sign in</h2><label class=f>Email</label><input id=em autocomplete="username"><label class=f>Password</label><input id=pw type=password autocomplete="current-password"><button class=big onclick="login()">Open dashboard</button><p class=mute>${S.err||'Sign in with your supervisor account.'}</p></div></div>`;
 const all=S.srv||[],rk={emergency:0,urgent:1,routine:2};
 const L=all.filter(c=>S.filter=='all'||c.cat==S.filter).sort((a,b)=>rk[a.cat]-rk[b.cat]||a.ts-b.ts);
 const cnt=k=>all.filter(c=>c.cat==k&&c.st=='New').length;
 if(S.pane==='resources')return `<div class="wrap wide"><div class=hero><span class=eyebrow style="color:#d5e3d8">Supervisor library</span><h1>Field guidance, ready to share.</h1><p>Upload non-patient education images such as referral maps or ANC posters. Files are stored in Cloudinary.</p><button class=tab style="margin-top:15px" onclick="S.pane='cases';render()">← Back to case queue</button></div><div class=card><h2>Add an education image</h2><div class=row><div><label class=f>Display title</label><input id=resourceTitle maxlength=100 placeholder="e.g. District referral contacts"></div><div><label class=f>Image · PNG, JPG, WebP</label><input id=resourceFile type=file accept="image/png,image/jpeg,image/webp"></div></div><div class=dropnote style="margin-top:12px">For staff guidance only. Do not upload patient photos, names, reports or case screenshots. Maximum file size: 5 MB.</div><button class=big onclick="addResource()" ${S.uploading?'disabled':''}>${S.uploading?'Uploading…':'Upload to Cloudinary'}</button></div><div class=resourcegrid>${(S.resources||[]).map(r=>`<article class="card resource"><img src="${esc(r.url)}" alt=""><h3>${esc(r.title)}</h3><div class=mute>Shared staff resource</div></article>`).join('')||'<p class=mute>No guidance images yet.</p>'}</div></div>`;
 return `<div class="wrap wide"><div class=hero><span class=eyebrow style="color:#d5e3d8">Jeevani · supervisor desk</span><h1>Care coordination, clearly.</h1><p>Review synced cases by urgency, acknowledge next steps and support your frontline team.</p><div class=statusrow style="margin-top:15px"><button class=tab onclick="S.pane='resources';loadResources()">✦ Education library</button><button class=tab onclick="loadSrv()">↻ Refresh cases</button></div></div><div class=statgrid><div class=stat><strong>${all.length}</strong><span>Synced cases</span></div><div class=stat><strong>${cnt('emergency')}</strong><span>Emergency · new</span></div><div class=stat><strong>${cnt('urgent')}</strong><span>Urgent · new</span></div><div class=stat><strong>${all.filter(c=>c.st==='Follow-up done').length}</strong><span>Follow-up complete</span></div></div><div class=card><b>Case queue</b> <span class=mute>· sorted by urgency</span><div class=chips style="margin-top:8px">${['all','emergency','urgent','routine'].map(k=>`<button class="chip ${S.filter==k?'on':''}" onclick="S.filter='${k}';render()">${k=='all'?'All ('+all.length+')':t(k)+' · '+cnt(k)+' new'}</button>`).join('')}</div></div>
 <div class="card scroll"><table><tr><th>Risk</th><th>Reasons</th><th>GA</th><th>Captured</th><th>Worker</th><th>Status</th></tr>${L.map(c=>`<tr><td><span class="pill ${esc(c.cat)}">${t(c.cat)}</span></td><td>${c.why.slice(0,3).map(esc).join('; ')||'No flags'}</td><td>${esc(c.d.ga||'—')}w</td><td>${fmt(c.ts)}</td><td>${esc(c.w)}</td><td><select onchange="setSt('${esc(c.id)}',this.value)">${['New','Acknowledged','Referred','Follow-up done'].map(o=>`<option ${o==c.st?'selected':''}>${o}</option>`).join('')}</select></td></tr>`).join('')}</table></div></div>`}
/* ---- shell ---- */
function render(){
 const hd=`<header><b>${S.lang=='hi'?'जीवनी':'Jeevani'}</b><button class="tab ${S.mode=='worker'?'on':''}" onclick="S.mode='worker';render()">Worker app</button><button class="tab ${S.mode=='sup'?'on':''}" onclick="S.mode='sup';S.pane='cases';S.sup?loadSrv():render()">Supervisor</button><label><input type=checkbox style="width:auto;min-height:0" ${S.off?'checked':''} onchange="S.off=this.checked;render()"> Offline</label><button class=tab onclick="S.lang=S.lang=='en'?'hi':'en';render()">${S.lang=='en'?'हिन्दी':'EN'}</button></header>`;
 let b;if(S.mode=='sup')b=sup();else{const v=S.view;b=`<div class=wrap>${v=='lock'?lock():(v=='home'?home():v=='cap'?cap():res())}</div>`}
 $('#app').innerHTML=hd+b}
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
